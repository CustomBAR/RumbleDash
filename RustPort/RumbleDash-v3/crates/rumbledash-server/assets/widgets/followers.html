<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Followers Goal - Rumble Streamer Dashboard</title>
        <link rel="stylesheet" href="/styles/followers.css" />
    </head>
    <body data-widget="followers">
        <div class="widget">
            <div class="progress-container">
                <div class="progress-bar">
                    <span class="invertcolor followers">Followers</span>
                    <span class="invertcolor counter" id="counter">0</span>
                    <span class="invertcolor goal" id="goal">0</span>
                    <div class="progress" id="progress"></div>
                </div>
            </div>
        </div>

        <script src="/scripts/widget.js"></script>
    </body>
</html>
