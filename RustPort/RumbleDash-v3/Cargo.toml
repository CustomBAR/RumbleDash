[workspace]
resolver = "2"
members = [
    "crates/rumbledash-core",
    "crates/rumbledash-server",
    "crates/rumbledash-app",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["CustomBAR"]
repository = "https://github.com/CustomBAR/RumbleDash"
homepage = "https://custombar.github.io/RumbleDash"

[workspace.dependencies]
rumbledash-core = { path = "crates/rumbledash-core" }
rumbledash-server = { path = "crates/rumbledash-server" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "http2", "native-tls", "form"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "system_fonts",
    "glow",
    "wayland",
    "x11",
    "links",
    "clipboard",
    "persistence",
] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
